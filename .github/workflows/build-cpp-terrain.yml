name: Build SkyTears Native Post (Geologia + Noise3D)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout project source
        uses: actions/checkout@v4

      - name: Verify C++ addon source exists
        shell: bash
        run: |
          echo 'Listing repository root:'
          ls -la
          echo 'Checking SkyTears C++ post extension:'
          if [ ! -f addons/skytears_cpp_post/SConstruct ] || [ ! -f addons/skytears_cpp_post/src/register.cpp ]; then
            echo '::error::Missing addons/skytears_cpp_post/SConstruct or src/register.cpp. Extract the provided GitHub-source ZIP into the ROOT of this repository and commit the addons/ directory.'
            exit 1
          fi
          ls -la addons/skytears_cpp_post/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: python -m pip install scons

      - name: Get official godot-cpp v4.5 bindings
        shell: bash
        run: |
          git clone --depth 1 --branch 4.5 https://github.com/godotengine/godot-cpp.git addons/skytears_cpp_post/godot-cpp
          test -f addons/skytears_cpp_post/godot-cpp/SConstruct

      - name: Compile Release and Debug binaries
        shell: bash
        working-directory: addons/skytears_cpp_post
        run: |
          set -e
          test -f SConstruct
          scons platform=${{ matrix.platform }} target=template_release arch=x86_64 -j2
          scons platform=${{ matrix.platform }} target=template_debug arch=x86_64 -j2
          cp skytears_cpp_post.gdextension.disabled skytears_cpp_post.gdextension
          ls -lh bin/

      - name: Verify expected binaries
        shell: bash
        working-directory: addons/skytears_cpp_post
        run: |
          if [ '${{ matrix.platform }}' = windows ]; then
            test -s bin/skytears_cpp_post.windows.template_release.x86_64.dll
            test -s bin/skytears_cpp_post.windows.template_debug.x86_64.dll
          else
            test -s bin/libskytears_cpp_post.linux.template_release.x86_64.so
            test -s bin/libskytears_cpp_post.linux.template_debug.x86_64.so
          fi

      - name: Upload compiled extension
        uses: actions/upload-artifact@v4
        with:
          name: SkyTears-NativePost-${{ matrix.platform }}
          path: |
            addons/skytears_cpp_post/bin/*
            addons/skytears_cpp_post/skytears_cpp_post.gdextension
          if-no-files-found: error
